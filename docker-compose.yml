# Base Compose — compatível com EasyPanel (sem container_name / sem ports no host).
#
# Produção (recomendado):
#   Compose file no EasyPanel = docker-compose.prod.yml
#
# Desenvolvimento local (com portas no host):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   → http://localhost:8080
#
# ⚠ Não publique a API na porta 3000 do host — o EasyPanel já usa 0.0.0.0:3000.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aguia
      POSTGRES_PASSWORD: aguia
      POSTGRES_DB: aguia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aguia_network
    expose:
      - "5432"

  gpswox-gateway:
    build:
      context: .
      dockerfile: services/gpswox-gateway/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aguia:aguia@postgres:5432/aguia
    volumes:
      - ./services/gpswox-gateway/logs:/app/logs
    networks:
      - aguia_network
    shm_size: "512mb"
    security_opt:
      - seccomp:unconfined
    expose:
      - "3001"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_PORT: 3000
      GATEWAY_URL: http://gpswox-gateway:3001
      DATABASE_URL: postgresql://aguia:aguia@postgres:5432/aguia
      CORS_ORIGIN: http://localhost:8080
    expose:
      - "3000"
    depends_on:
      - postgres
      - gpswox-gateway
    networks:
      - aguia_network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - aguia_network
    expose:
      - "80"

networks:
  aguia_network:
    driver: bridge

volumes:
  postgres_data:
